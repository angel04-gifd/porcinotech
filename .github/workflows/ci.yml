# Valida el proyecto antes de integrar: análisis estático y pruebas.
# Corre en cada push de rama (no en tags, que publica release.yml)
# y se puede lanzar a mano desde la pestaña Actions.
name: Validar (analyze y test)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
